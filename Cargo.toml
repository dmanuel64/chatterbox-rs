[package]
name = "chatterbox-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
hound = "3.5.1"
ndarray = "0.17"
ort = "2.0.0-rc.13"
rand = "0.10"
rubato = "5"
symphonia = "0.6"
thiserror = "2"
tokenizers = "0.23"

[features]
default = ["common-audio-formats"]

cuda = ["ort/cuda"]

mp3 = ["symphonia/mp3"]
mp4 = ["symphonia/aac", "symphonia/isomp4"]
common-audio-formats = ["mp3", "mp4"]
all-audio-formats = ["symphonia/all"]

watermark = []

[dev-dependencies]
clap = { version = "4", features = ["derive"] }
